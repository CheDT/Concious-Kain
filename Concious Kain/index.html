<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f9f9ed">
  <meta name="description" content="Conscious Kain, a Filipino food ordering browser demo.">
  <title>Conscious Kain</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="layout.css">
  <script defer src="app.js"></script>
</head>
<body>
  <svg class="symbol-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M20 3C8 2 2 7 5 16c7 5 14-1 15-13Z"/><path d="m4 21 11-12"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="7.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="i-cart" viewBox="0 0 24 24"><path d="M2 3h3l3 13h11l3-10H6"/><circle cx="10" cy="21" r="1"/><circle cx="18" cy="21" r="1"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-8 9 8v11h-7v-7h-4v7H3Z"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M3 22v-3c0-7 18-7 18 0v3Z"/></symbol>
    <symbol id="i-orders" viewBox="0 0 24 24"><path d="M7 3h12v19H5V3h2m2-2h6v5H9Z"/><path d="M9 10h6m-6 4h6m-6 4h4"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21 3 12C-3 3 8-1 12 6c4-7 15-3 9 6Z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 4-8 8 8 8"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="m9 4 8 8-8 8"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M3 7h18M3 17h18"/><circle cx="16" cy="7" r="3"/><circle cx="8" cy="17" r="3"/></symbol>
    <symbol id="i-bowl" viewBox="0 0 24 24"><path d="M2 11h20c-1 8-4 9-10 9S3 19 2 11Zm4 11h12M8 2v5m4-6v6m4-5v5"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 1v3m0 16v3M1 12h3m16 0h3M4 4l2 2m12 12 2 2M4 20l2-2M18 6l2-2"/></symbol>
    <symbol id="i-snack" viewBox="0 0 24 24"><path d="M5 8c-4 1-2 7 1 7l8 6c4 1 8-5 5-8l-7-8C9 2 3 4 5 8Z"/><path d="m9 8 2 2m3 2 2 2m-6 1 2 2"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 6h16M8 6V3h8v3M6 6l1 16h10l1-16M10 10v8m4-8v8"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="m9 3 1-2h4l1 2 3 2 3 1-1 4v4l1 4-3 1-3 2-1 2h-4l-1-2-3-2-3-1 1-4v-4L3 6l3-1Z"/><circle cx="12" cy="12" r="4"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 9c0 6-8 13-8 13S4 15 4 9a8 8 0 1 1 16 0Z"/><circle cx="12" cy="9" r="2.5"/></symbol>
  </svg>
  <div class="device" id="device">
    <div class="screen">
      <header id="app-header"></header>
      <main id="app-content" tabindex="-1"><p class="loading">Preparing the menu…</p></main>
      <nav class="tab-bar" id="tab-bar" aria-label="Main navigation"></nav>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <dialog id="app-dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
    </div>
  </div>
  <script nomodule>document.querySelector('.loading').textContent='Please open this demo in a current browser.';</script>
</body>
</html>
